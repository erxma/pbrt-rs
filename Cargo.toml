[package]
name = "pbrt-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
anyhow = "1.0.96"
approx = "0.5.1"
bitflags = "2.6.0"
bon = "3.6.4"
bumpalo = "3.16.0"
bytemuck = { version = "1.16.3", features = ["derive"] }
clap = { version = "4.5.30", features = ["derive"] }
crossbeam-utils = "0.8.20"
delegate = "0.13.3"
derive_builder = "0.20.1"
derive_more = { version = "2.0.1", features = ["add", "add_assign", "mul", "mul_assign", "not", "from", "index", "index_mut"] }
enum-as-inner = "0.6.0"
enum_dispatch = "0.3.13"
env_logger = "0.11.5"
exr = "1.72.0"
glam = { version = "0.30.4", optional = true, features = ["bytemuck"] }
hashbrown = "0.15.4"
indicatif = { version = "0.17.8", features = ["rayon"] }
inherent = "1.0.11"
internment = { version = "0.8.4", optional = true, features = ["arc"] }
itertools = "0.14.0"
libm = "0.2.8"
log = "0.4.22"
murmur3 = "0.5.2"
num-traits = "0.2.19"
ordered-float = "5.0.0"
overload = "0.1.1"
rand = "0.9.1"
rand_pcg = "0.9.0"
rayon = "1.10.0"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0.12"
time = { version = "0.3.36", features = ["formatting", "local-offset", "macros"] }
uuid = { version = "1.17.0", features = ["v4"] }
winnow = "0.7.11"

[features]
use-f64 = []
external-impls = ["glam"]
glam = ["dep:glam"]

[dev-dependencies]
maplit = "1.0.2"
